name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build the module package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - run: corepack enable

      - name: Check the tag against the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. A release is tagged v<version>."
            exit 1
          fi

      - name: Install
        run: yarn install --immutable

      - name: Build the package
        run: yarn package

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" castika-streamlevel-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
